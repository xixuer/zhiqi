<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="description" content="Responsive Bootstrap 4 and web Application ui kit.">
<title>:: PostMan :: Chat Application</title>
<link rel="icon" href="https://www.lovechat.ink/icon/apple-touch-icon.png" type="image/x-icon" />

<link rel="stylesheet" href="assets/fonts/material-icon/css/material-design-iconic-font.min.css">

<link rel="stylesheet" href="assets/css/style.min.css">

<body>
    <div id="layout" class="theme-cyan">
        <div class="authentication">
            <div class="container d-flex flex-column">
                <div class="row align-items-center justify-content-center no-gutters min-vh-100">
                    <div class="col-12 col-md-7 col-lg-5 col-xl-4 py-md-11">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">

                                <h3 class="text-center">密码修改</h3>

                                <p class="text-center mb-6">请在下方输入框中填入修改后的密码</p>

                                <form class="mb-4 mt-5">

                                    <div class="input-group mb-2">
                                        <input type="password" class="form-control form-control-lg"
                                            placeholder="温馨提示，密码非常重要，请不要将自己的密码透露给任何人" id="input">
                                    </div>

                                    <div class="text-center mt-5">
                                        <a href="#" class="btn btn-lg btn-primary" title="" id="sent">提交密码</a>
                                    </div>
                                </form>

                                <!-- <p class="text-center mb-0">Already have an account? <a class="link"
                                        href="signin.html">Sign in</a>.</p> -->
                            </div>
                        </div>
                    </div>
                    <div class="signin-img d-none d-lg-block text-center">
                        <img src="assets/images/signin-img-cyan.svg" alt="Sign In Image" />
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/vendor/jquery/jquery-3.5.1.min.js" type="234466f1b1e4f254a1df5aa3-text/javascript"></script>
    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"
        type="234466f1b1e4f254a1df5aa3-text/javascript"></script>
    <script src="https://ajax.cloudflare.com/cdn-cgi/scripts/7089c43e/cloudflare-static/rocket-loader.min.js"
        data-cf-settings="234466f1b1e4f254a1df5aa3-|49" defer=""></script>
</body>

<script>
    document.getElementById("sent").addEventListener("click", function () {
        const passwordInput = document.getElementById("input").value.trim();
        const userToken = localStorage.getItem('user_token');

        // 检查密码是否为空
        if (!passwordInput) {
            alert("请输入新密码，不能为空！");
            return;
        }

        const url = "/url/java/update";
        fetch(url, {
            method: 'POST', // 注意：方法名应该是字符串
            headers: {
                'Content-Type': 'application/json' // 设置请求头
            },
            body: JSON.stringify({
                password: passwordInput,
                user_token: userToken
            })
        }).then(response => {
            if (!response.ok) {
                throw new Error('网络响应不正常');
            }
            return response.json();
        })
            .then(data => {
                if (data.code == 300) {  // 假设服务器返回一个包含 success 字段的 JSON
                    alert("密码修改成功！请重新登录。");
                    window.location.href = "signin.html";  // 跳转到登录页面
                } else {
                    alert("密码修改失败：" + (data.message || "未知错误"));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("发生错误，密码修改异常。请稍后再试。");
            });
    });


</script>

</html>
