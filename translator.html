            <script>
                document.addEventListener('DOMContentLoaded', function () {
                    if (!window.hasFetched) {
                        window.hasFetched = true;
                        var List = document.getElementById('message-list');
                        const userToken = localStorage.getItem('user_token');
                        const url = "/url/java/getMessage?" + "userToken=" + userToken;
                        fetch(url, {
                            method: 'GET',
                        })
                            .then(response => {
                                return response.json().then(data => {
                                    if (data === "TOKEN_EXPIRED") {
                                        // Token 已过期
                                        localStorage.removeItem('user_token');
                                        window.location.href = 'signin.html';  // 重定向到登录页面
                                        throw new Error("Token expired");
                                    }
                                    return { response, data };  // 将response和data都传递下去
                                });
                            })
                            .then(({ response, data }) => {
                                if (!response.ok) {
                                    throw new Error('Network response was not ok ' + response.statusText);
                                }
                            })
                            .catch(error => {
                                console.error('Error:', error);
                                window.location.assign("signin.html");
                            });
                        getWords("/url/word/get_result");

                    }
                });

            </script>

                        },
                        complete: function () {

                        }
                    })
                }

                        document.querySelector('.form-control').style.caretColor = 'black';
                        // 保存主题到本地存储
                        localStorage.setItem('theme', 'light');
                    }
                }

                // 初始化时检查本地存储中的主题并设置主题和复选框状态
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme) {
                    const isDark = savedTheme === 'dark';
                    themeToggle.checked = isDark; // 设置复选框状态
                    updateTheme(isDark);
                } else {
                    // 如果没有保存的主题，使用复选框的默认状态
                    updateTheme(themeToggle.checked);
                }

                // 监听复选框的变化，切换主题
                themeToggle.addEventListener('change', function () {
                    updateTheme(this.checked);
                });


            </script>

            <!-- chatJS -->
            <script>
                const options = {
                    gfm: true,
                    breaks: true,
                    smartLists: true,
                    highlight: function (code) {
                        return hljs.highlightAuto(code).value;
                    }
                };
                document.addEventListener('DOMContentLoaded', function () {
                    var input = document.getElementById('user-input');

                    input.addEventListener('keypress', function (e) {
                        if ((e.which === 13 || e.keyCode === 13) && !e.shiftKey) {
                            // 如果只是普通的 Enter 按键，发送消息
                            var content = input.value;
                            if (content.trim() !== "") {
                                sendMessage();
                            }
                            e.preventDefault();
                        }
                    });
                });

                function sendMessage() {
                    const content = $("#user-input").val();
                    $('#user-input').val('');


                    if (!content.trim()) {
                        alert("输入的内容不可以为空!");
                        return;
                    }

                    const userToken = localStorage.getItem('user_token');
                    var language = getSelectedLanguage();
                    var level = getSelectedTranslationLevel();
                    var mode = getSelectedMode();

                    if (mode == null) {
                        alert("请先选择模式!");
                        return;
                    }
                    if (language == null || level == null) {
                        alert("所选参数不全，请检查！,请点击绿色send按钮左侧的复选框按钮勾选参数!");
                        return;
                    }

                    addUserMessage(content);
                    scrollToBottom();
                    showWaitingAnimation();
                    if (mode == "写作") {
                        fetch("/url/tran/get_essay/", {
                            method: 'POST',
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                input: content,
                                input_language: "",
                                output_language: language,
                                level: level
                            })
                        })
                            .then(response => handleStream(response.body))
                            .catch(handleError);
                    } else {
                        fetch("/url/tran/get_translator/", {
                            method: 'POST',
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                input: content,
                                input_language: "",
                                output_language: language,
                                level: level
                            })
                        })
                            .then(response => handleStream(response.body))
                            .catch(handleError);
                    }

                }

                function handleStream(stream) { //流式调用的关键逻辑
                    const reader = stream.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let buffer = '';

                    function read() {
                        reader.read().then(({ done, value }) => {
                            if (done) {
                                handleResponse();
                                return;
                            }

                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n\n');
                            buffer = lines.pop();  // 保留未处理完的部分

                            lines.forEach((line, index) => processLine(line, index));
                            read();  // 继续读取下一个数据块
                        }).catch(handleError);
                    }

                    read();
                }

                function processLine(line, index) {
                    if (line.trim() !== '') {
                        try {
                            const jsonString = line.replace(/^data:/, '').trim(); //去掉返回的SSE格式数据前面的data，保证数据可以打包成json
                            const data = JSON.parse(jsonString);


                            if (data.choices && data.choices.length > 0) {
                                const delta = data.choices[0].delta;
                                if (delta && delta.content) {
                                    addMessageChunk(delta.content); // 提取并处理content
                                }
                            }

                            // 处理message_end事件（如有）
                            if (data.choices.finish_reason === "stop") {
                                handleResponse();
                            }
                        } catch (e) {
                            console.error(`Error processing line ${index}:`, e);
                        }
                    }
                }

                function handleResponse() {
                    const waiting = $("#waiting");
                    if (waiting.length) {
                        const currentContent = waiting.find('.message-content p').html() || '';

                        // 配置 marked 使用 highlight.js
                        marked.setOptions({
                            highlight: function (code, lang) {
                                // 如果指定了语言，使用该语言的高亮
                                if (lang && hljs.getLanguage(lang)) {
                                    return hljs.highlight(code, { language: lang }).value;
                                }
                                // 否则，使用自动检测
                                return hljs.highlightAuto(code).value;
                            }
                        });

                        var finalAnswer = marked.parse(currentContent);

                        const reply = `
        <li class="d-flex message">
          <div class="message-body">
            <div class="message-row d-flex align-items-center">
              <div class="message-content p-3">
                <p>${finalAnswer}</p>
              </div>
            </div>
          </div>
        </li>
        `;
                        waiting.remove();
                        $("#message-list").append(reply);
                    }
                }


                function handleError(error) {
                    console.error("Fetch Error:", error);
                    $('#waiting').remove();
                    const errorMessage = `
    <li class="d-flex message">
      <div class="message-body">
        <div class="message-row d-flex align-items-center">
          <div class="message-content p-3">
            服务器出现了一些故障，请稍后再试。
          </div>
        </div>
      </div>
    </li>
  `;
                    $('#message-list').append(errorMessage);
                }


                function addRobotMessage(data) {
                    const waiting = $("#waiting");
                    var finalAnswer = marked.parse(data, options);
                    const reply = `
      <li class="d-flex message">
        <div class="message-body">
          <div class="message-row d-flex align-items-center">
            <div class="message-content p-3">
              <p>${finalAnswer}</p>
            </div>
          </div>
        </div>
      </li>
    `;
                    waiting.remove();
                    $("#message-list").append(reply);
                }


                function addUserMessage(content) {
                    const newMessage = `
    <li class="d-flex message right">
      <div class="message-body">
        <div class="message-row d-flex align-items-center justify-content-end">
          <div class="message-content border p-3">
            ${marked.parse(content, options)}
          </div>
          <div class="mr-lg-3 me-2" style="margin-left: 16px;">
            <div class="avatar sm rounded-circle bg-primary d-flex align-items-center justify-content-center">
              <span>
                <img src="assets/images/user.png" class="avatar sm rounded-circle" alt="user avatar">
              </span>
            </div>
          </div>
        </div>
      </div>
    </li>
  `;
                    $('#message-list').append(newMessage);
                }

                function showWaitingAnimation() {
                    const waiting = `
    <li class="d-flex message" id="waiting">
      <div class="message-body">
        <div class="message-row d-flex align-items-center">
          <div class="message-content p-3">
            <p>结果可能需要等待一小会儿，别着急哟~</p>
            <div class="wave" id="wave">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
        </div>
      </div>
    </li>
  `;
                    $('#message-list').append(waiting);
                }

                function scrollToBottom() {
                    const messages = document.querySelectorAll('.message');
                    const lastMessage = messages[messages.length - 1]; // 获取最后一条消息
                    if (lastMessage) {
                        lastMessage.scrollIntoView({ behavior: 'smooth' }); // 平滑滚动到最后一条消息
                    }
                }

                function addMessageChunk(chunk) {
                    const waiting = $('#waiting');
                    const currentContent = waiting.find('.message-content').data('full-content') || '';

                    // Concatenate new chunk to current content
                    const newContent = currentContent + chunk;

                    // Store the full content without rendering it part by part
                    waiting.find('.message-content').data('full-content', newContent);

                    // Update the HTML with the parsed markdown of the complete content
                    const parsedContent = marked.parse(newContent, options);
                    waiting.find('.message-content p').html(parsedContent);




                }

                // 获取选中的翻译语言
                function getSelectedMode() {
                    const selectedMode = document.querySelector('input[name="mode-write"]:checked');
                    return selectedMode ? selectedMode.value : null;
                }

                // 获取选中的翻译等级
                function getSelectedTranslationLevel() {
                    const selectedLevel = document.querySelector('input[name="translation-level"]:checked');
                    return selectedLevel ? selectedLevel.value : null;
                }

                // 获取选中的翻译语言
                function getSelectedLanguage() {
                    const selectedLanguage = document.querySelector('input[name="language"]:checked');
                    return selectedLanguage ? selectedLanguage.value : null;
                }
            </script>

            <!-- selectJS -->
            <script>
                document.addEventListener('DOMContentLoaded', function () {
                    var chatItems = document.querySelectorAll('.chat-list li');
                    var chatLinks = document.querySelectorAll('.chat-list a');

                    // 从 localStorage 中读取上次选中的项
                    var selectedIndex = parseInt(localStorage.getItem('selectedChatIndex'), 10);

                    if (!isNaN(selectedIndex) && selectedIndex < chatItems.length && selectedIndex >= 0) {
                        // 将读取的索引对应的项设置为选中状态
                        chatItems[selectedIndex].classList.add('selected');
                    } else {
                        // 如果没有记录则默认选中第一个列表项
                        if (chatItems.length > 0) {
                            chatItems[0].classList.add('selected');
                        }
                    }

                    // 事件委托：为聊天列表添加点击事件监听器
                    document.querySelector('.chat-list').addEventListener('click', function (event) {
                        var link = event.target.closest('a');

                        if (link) {
                            // 移除所有项的 'selected' 类
                            chatItems.forEach(function (item) {
                                item.classList.remove('selected');
                            });

                            // 为被点击的父项 <li> 添加 'selected' 类
                            var parentItem = link.parentElement;
                            if (parentItem) {
                                parentItem.classList.add('selected');
                            }

                            // 获取当前项的索引并存储到 localStorage
                            var index = Array.prototype.indexOf.call(chatItems, parentItem);
                            if (index !== -1) {

                                localStorage.setItem('selectedChatIndex', index);
                            }
                        }
                    });
                });

            </script>


            <script>
                document.querySelector('.input-group-text button').addEventListener('click', function () {
                    const sections = ['mode-selection', 'level-selection', 'language-selection'];
                    sections.forEach(id => {
                        const section = document.getElementById(id);
                        section.classList.toggle('d-none');
                    });
                });
            </script>
