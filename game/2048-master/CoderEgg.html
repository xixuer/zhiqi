<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智启项目组签名墙</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Pacifico', cursive;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }
        h1 {
            font-size: 2.5em;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .signature-wall {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .signature-item {
            position: absolute;
            white-space: nowrap;
            font-size: 2em; /* 调整字体大小 */
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
            opacity: 0.8;
            transition: all 0.3s ease;
            animation: glow 1s infinite alternate, fadeInOut 2.5s ease-in-out; /* 添加新的动画效果 */
        }
        .signature-item:hover {
            transform: scale(1.1);
            opacity: 1;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        @keyframes glow {
            from {
                text-shadow: 0 0 5px rgba(255,255,255,0.5);
            }
            to {
                text-shadow: 0 0 20px rgba(255,255,255,1);
            }
        }
        @keyframes fadeInOut {
            0% {
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <canvas id="fireworks"></canvas>
    <div class="container">
        <h1>欢迎来到智启项目组 主创团队签名墙</h1>
        <div class="signature-wall" id="signatureWall"></div>
    </div>

    <script>
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        var sparks = [];
        var fireworks = [];
        var i = 20; while(i--) {
            fireworks.push(
                new Firework(Math.random()*window.innerWidth, window.innerHeight*Math.random())
            )
        }
        
        render();

        function render() {
            setTimeout(render, 1000/60);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            for(var firework of fireworks) {
                if(firework.dead) continue;
                firework.move();
                firework.draw();
            }
            for(var spark of sparks) {
                if(spark.dead) continue;
                spark.move();
                spark.draw();
            }
            
            if(Math.random() < 0.05) {
                fireworks.push(new Firework());
            }
        }
        
        function Spark(x, y, color) {
            this.x = x;
            this.y = y;
            this.dir = Math.random() * (Math.PI*2);
            this.dead = false;
            this.color = color;
            this.speed = Math.random() * 3 + 3;
            this.walker = new Walker({ radius: 20, speed: 0.25 });
            this.gravity = 0.25;
            this.dur = this.speed / 0.1;
            this.move = function() {
                this.dur--;
                if(this.dur < 0) this.dead = true;
                
                if(this.speed < 0) return;
                if(this.speed > 0) this.speed -= 0.1;
                var walk = this.walker.step();
                this.x += Math.cos(this.dir + walk) * this.speed;
                this.y += Math.sin(this.dir + walk) * this.speed;
                this.y += this.gravity;
                this.gravity += 0.05;
                
            }
            this.draw = function() {
                drawCircle(this.x, this.y, 3, this.color);
            }
        }
        
        function Firework(x, y) {
            this.xmove = new Walker({radius: 10, speed: 0.5});
            this.x = x || Math.random() * ctx.canvas.width;
            this.y = y || ctx.canvas.height;
            this.height = Math.random()*ctx.canvas.height/2;
            this.dead = false;
            this.color = randomColor();
            
            this.move = function() {
                this.x += this.xmove.step();
                if(this.y > this.height) this.y -= 1; 
                else this.burst();
                
            }
            this.draw = function() {
                drawCircle(this.x, this.y, 1, this.color);
            }
            this.burst = function() {
                this.dead = true;
                var i = 100; while(i--) sparks.push(new Spark(this.x, this.y, this.color));
            }
        }
        
        function drawCircle(x, y, radius, color) {
            color = color || '#FFF';
            ctx.fillStyle = color;
            ctx.fillRect(x-radius/2, y-radius/2, radius, radius);
        }
        
        function randomColor(){
            return ['#93c47d','#a4c2f4','#b4a7d6','#c27ba0','#f6b26b', '#ffd966'][Math.floor(Math.random() * 6)];
        }
        
        function Walker(options){
            this.step = function(){
                this.direction = Math.sign(this.target) * this.speed;
                this.value += this.direction;
                this.target
                    ? this.target -= this.direction
                    : (this.value)
                        ? (this.wander) 
                            ? this.target = this.newTarget() 
                            : this.target = -this.value
                        : this.target = this.newTarget();  
                return this.direction;
            }
                
            this.newTarget = function() {
                return Math.round(Math.random()*(this.radius*2)-this.radius);
            }
            
            this.start = 0;
            this.value = 0;
            this.radius = options.radius;
            this.target = this.newTarget();
            this.direction = Math.sign(this.target);
            this.wander = options.wander;
            this.speed = options.speed || 1;
        }

        const names = ['李鸿麟', '谢子豪', '王浩宇', '李昌', '赵子钧', '杨冬平'];
        const signatureWall = document.getElementById('signatureWall');

        function createSignatureItem(name) {
            const item = document.createElement('div');
            item.className = 'signature-item';
            item.textContent = name;
            item.style.left = `${window.innerWidth}px`;
            item.style.top = `${Math.random() * (window.innerHeight - 50)}px`;
            signatureWall.appendChild(item);

            const duration = 2500; // 2.5秒
            const animation = item.animate([
                { transform: 'translateX(0)' },
                { transform: `translateX(-${window.innerWidth + item.offsetWidth}px)` }
            ], {
                duration: duration,
                easing: 'linear',
                iterations: 1
            });

            animation.onfinish = () => {
                item.remove();
            };

            return { item, animation };
        }

        let signatureItems = [];
        let nameQueue = [];

        function initSignatures() {
            shuffleArray(names); // 随机打乱队列
            nameQueue = [...names];
            startSignatureLoop();
        }

        function startSignatureLoop() {
            names.forEach((name, index) => {
                setTimeout(() => {
                    signatureItems.push(createSignatureItem(name));
                }, index * 2500); // 每隔2.5秒出现一个名字
            });

            setTimeout(() => {
                signatureItems = [];
                shuffleArray(names); // 再次随机打乱队列
                nameQueue = [...names];
                startSignatureLoop();
            }, names.length * 2500); // 所有名字显示完毕后重新开始
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        canvas.addEventListener('click', (e) => {
            fireworks.push(new Firework(e.clientX, e.clientY));
        });

        // 显示alert弹窗
        alert('恭喜你发现彩蛋！');

        // 延迟启动姓名字幕动画
        setTimeout(() => {
            initSignatures();
        }, 100); // 延迟100毫秒确保弹窗关闭后启动
    </script>
</body>
</html>
