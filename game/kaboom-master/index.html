<!DOCTYPE html>

<html class="h-100">
<head>
    <meta charset="UTF-8">

    <title>扫雷</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="lib/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column h-100">
    <main class="flex-shrink-0">
        <div class="container">
            <h1>扫雷</h1>
            <div class="card">
                <div class="card-body">
                    <div id="game"></div>
                </div>
            </div>
            <div class="mt-2">

            </div>
            <div class="row">
                <div class="col-lg-3 col-md-6 mt-2">
                    <form id="form" onsubmit="newGame(event)">
                        <div>
                            <button class="btn btn-primary w-100" id="new-game">新游戏</button>
                        </div>
                        <div class="input-group mt-2">
                            <div class="input-group-prepend">
                                <div class="input-group-text">宽度</div>
                            </div>
                            <input onchange="updateMax()" id="width" type="number" class="form-control" min="1" max="30" value="10">
                        </div>
                        <div class="input-group mt-2">
                            <div class="input-group-prepend">
                                <div class="input-group-text">高度</div>
                            </div>
                            <input onchange="updateMax()" id="height" type="number" class="form-control" min="1" max="30" value="10">
                        </div>
                        <div class="input-group mt-2">
                            <div class="input-group-prepend">
                                <div class="input-group-text">地雷</div>
                            </div>
                            <input id="numMines" type="number" class="form-control" min="1" max="899" value="20">
                        </div>
                    </form>
                </div>
                <div class="col-lg-3 col-md-6 mt-2">
                    <button onClick="setParams(8, 8, 8)" class="btn btn-light w-100" id="new-game">简单</button>
                    <button onClick="setParams(10, 10, 20)" class="btn btn-light w-100 mt-2" id="new-game">一般</button>
                    <button onClick="setParams(15, 15, 50)" class="btn btn-light w-100 mt-2" id="new-game">困难</button>
                    <button onClick="setParams(10, 10, 50)" class="btn btn-light w-100 mt-2" id="new-game">专家</button>
                </div>
                <div class="col-lg-6 mt-2">
                    <div>
                        <label class="form-check-label">
                            <input id="debug" type="checkbox">
                            调试模式
                        </label>
                    </div>
                    <div>
                        <label class="form-check-label">
                            <input id="allowOutside" type="checkbox">
                            允许在任何地方猜测 <abbr title="默认情况下，你只能在已揭示方块的边界上猜测。">(?)</abbr>
                        </label>
                    </div>
                    <div>
                        <label class="form-check-label">
                            <input id="safeMode" type="checkbox">
                            安全模式（双击揭示）
                        </label>
                    </div>
                    <div>
                    <label class="form-check-label">
                        <input id="countdownMode" type="checkbox">
                        倒计时模式 <abbr title="不显示方块周围的总地雷数，而是显示剩余的地雷数（基于放置的旗帜）">(?)</abbr>
                    </label>
                    </div>
                    <div>
                        <button onClick="hint()" class="btn btn-light btn-sm mt-2">给我一个提示</button>
                        <button id="undo" onClick="undo()" class="btn btn-light btn-sm mt-2">撤销</button>
                    </div>
                    <div id="hint" class="hidden text-muted mt-2">你好，世界</div>
                </div>
            </div>
            <h2>这是什么？</h2>
            <p>这是一个<b>烧脑但公平</b>的扫雷游戏：</p>
            <ul>
                <li>地雷不是在开始时放置的，而是随着你的游戏进程确定的。没有隐藏状态。</li>
                <li>如果你尝试猜测，游戏总会选择最坏的情况。</li>
                <li>除非你<b>被迫</b>猜测（没有任何安全方块）。那时，猜测是完全安全的。</li>
                <li>你仍然需要选择一个<b>相邻</b>的方块。选择“允许在任何地方猜测”如果你想在棋盘的其他地方玩。</li>       
            </ul>
            <p>祝你玩得开心！</p>
        </div>
    </main>


    <script src="lib/minisat.js"></script>
    <script src="lib/long-press-event.min.js"></script>
    <script src="sat.js"></script>
    <script src="index.js"></script>
</body>
</html>
