    <!-- themeJS -->
    <script>
        // 获取复选框元素
        const themeToggle = document.querySelector('.light-dark-btn');

        // 获取<link>标签
        const themeStyle = document.getElementById('theme-style');

        // 定义切换函数
        function updateTheme(isDark) {
            if (isDark) {
                themeStyle.setAttribute('href', 'assets/css/highlight/styles/github-dark.css');
                document.querySelector('.form-control').style.color = 'white';
                document.querySelector('.form-control').style.caretColor = 'white';
                // 保存主题到本地存储
                localStorage.setItem('theme', 'dark');
            } else {
                themeStyle.setAttribute('href', 'assets/css/highlight/styles/github.css');
                document.querySelector('.form-control').style.color = 'black';
                document.querySelector('.form-control').style.caretColor = 'black';
                // 保存主题到本地存储
                localStorage.setItem('theme', 'light');
            }
        }

        // 初始化时检查本地存储中的主题并设置主题和复选框状态
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            const isDark = savedTheme === 'dark';
            themeToggle.checked = isDark; // 设置复选框状态
            updateTheme(isDark);
        } else {
            // 如果没有保存的主题，使用复选框的默认状态
            updateTheme(themeToggle.checked);
        }

        // 监听复选框的变化，切换主题
        themeToggle.addEventListener('change', function () {
            updateTheme(this.checked);
        });


    </script>

    <!-- newChatJS -->
    <script>
        function newChat() {
            const userToken = localStorage.getItem("user_token");
            const url = "/url/java/newCodeChat?userToken=" + userToken;


            fetch(url, {
                method: 'GET'
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                })
                .then(data => {
                    location.reload();
                })
                .catch(error => {
                    console.error('There was a problem with the fetch operation:', error);
                });
        }
    </script>

    <!-- getHistroricMessage -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
          if (!window.hasFetched) {
            window.hasFetched = true;
            const List = document.getElementById('message-list');
            const userToken = localStorage.getItem('user_token');
            const url = "/url/java/getCodeMessage?userToken=" + userToken;
    
            fetch(url, {
              method: 'GET',
            })
            .then(response => {
              return response.json().then(data => {
                if (data === "TOKEN_EXPIRED") {
                  localStorage.removeItem('user_token');
                  window.location.href = 'signin.html';
                  throw new Error("Token expired");
                }
                return { response, data };
              });
            })
            .then(({ response, data }) => {
              if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
              }
    
              handleMessage(data);
            })
            .catch(error => {
              window.location.href = "signin.html";
              console.error('Error:', error);
            });
          }
    
          function handleMessage(data) {
            const dataArray = data.data;
    
            if (dataArray.length === 0) {
              return;
            }
            dataArray.forEach(item => {
              addUserMessage(item.query);
              addRobotMessage(item.answer);
            });
          }
    
          function addCopyButton(codeBlock) {
            // 创建按钮并添加预定义的类名
            const button = $('<button class="copy-button">复制</button>');
            
            // 将按钮插入到codeBlock之前
            $(codeBlock).before(button);

            // 设置父元素相对定位，以使按钮的绝对定位工作正常
            $(codeBlock).parent().css({ position: 'relative' });

            // 定义按钮点击事件
            button.on('click', () => {
                const code = $(codeBlock).text();
                copyToClipboard(code);
            });
        }

            function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('代码已复制到剪贴板!');
            }

            function addRobotMessage(answer) {
            marked.setOptions({
                highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
                }
            });

            var Answer = marked.parse(answer);
            const reply = `
                <li class="d-flex message">
                <div class="message-body">
                    <div class="message-row d-flex align-items-center">
                    <div class="message-content p-3">
                        ${Answer}
                    </div>
                    </div>
                </div>
                </li>
            `;
            $("#message-list").append(reply);
            hljs.highlightAll();

            // 为所有刚刚添加的code块添加复制按钮
            $("#message-list pre code").each(function() {
                addCopyButton(this);
            });
            }
        });
      </script>

    <!-- chatJS -->
    <script>
        const options = {
            gfm: true,
            breaks: true,
            smartLists: true,
            highlight: function (code) {
                return hljs.highlightAuto(code).value;
            }
        };

        document.addEventListener('DOMContentLoaded', function () {
            var input = document.getElementById('user-input');

            input.addEventListener('keypress', function (e) {
                if ((e.which === 13 || e.keyCode === 13) && !e.shiftKey) {
                    // 如果只是普通的 Enter 按键，发送消息
                    var content = input.value;
                    if (content.trim() !== "") {
                        sendMessage();
                    }
                    e.preventDefault();
                }
            });
        });

        function sendMessage() {
            var content = $("#user-input").val();
            $('#user-input').val('');


            if (!content.trim()) {
                alert("输入的内容不可以为空!");
                return;
            }

            addUserMessage(content);
            scrollToBottom();
            showWaitingAnimation();

            const userToken = localStorage.getItem('user_token');
            const url = "/url/java/coder";

            fetch(url, {
                method: 'POST',
                body: JSON.stringify({
                    content: content,
                    user_token: userToken,
                })
            })
                .then(response => handleStream(response.body))
                .catch(handleError);
        }

        function scrollToBottom() {
            const messages = document.querySelectorAll('.message');
            const lastMessage = messages[messages.length - 1]; // 获取最后一条消息
            if (lastMessage) {
                lastMessage.scrollIntoView({ behavior: 'smooth' }); // 平滑滚动到最后一条消息
            }
        }

        function handleStream(stream) { //流式调用的关键逻辑
            const reader = stream.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';

            function read() {
                reader.read().then(({ done, value }) => {
                    if (done) {
                        handleResponse();
                        return;
                    }

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split(/(?<=\n\n)/); // 确保完整分割
                    buffer = lines.pop();  // 保留未处理完的部分

                    lines.forEach((line, signin) => processLine(line, signin));
                    read();  // 继续读取下一个数据块
                }).catch(handleError);
            }

            read();
        }

        function processLine(line, signin) {
            if (line.trim() !== '') {
                try {
                    const jsonString = line.replace(/^data:/, '').trim();
                    const data = JSON.parse(jsonString);


                    if (data.event === "message" && data.answer) {
                        // Instead of waiting for message_end, show the parsed content immediately
                        addMessageChunk(data.answer);
                    }

                    // message_end event can be used to handle if you have any final operations
                    else if (data.event === "message_end") {
                        handleResponse();
                    }
                } catch (e) {
                    console.error(`Error processing line ${signin}:`, e);
                }
            }
        }


        function handleResponse() {
            const waiting = $("#waiting");
            if (waiting.length) {
                const currentContent = waiting.find('.message-content p').data('full-content') || '';

                marked.setOptions({
                    highlight: function (code, lang) {
                        const safeCode = code.replace(/#/g, '&#35;');
                        if (lang && hljs.getLanguage(lang)) {
                            return hljs.highlight(safeCode, { language: lang }).value;
                        }
                        return hljs.highlightAuto(safeCode).value;
                    }
                });

                var finalAnswer = marked.parse(currentContent);
                const reply = $(`
                    <li class="d-flex message">
                        <div class="message-body">
                            <div class="message-row d-flex align-items-center">
                                <div class="message-content p-3">
                                    <p>${finalAnswer}</p>
                                </div>
                            </div>
                        </div>
                    </li>
                `);
                waiting.remove();
                $("#message-list").append(reply);
                reply.find('pre code').each((i, block) => {
                    addCopyButton(block);
                    hljs.highlightElement(block);
                });
            }
        }

        function handleError(error) {
            console.error("Fetch Error:", error);
            $('#waiting').remove();
            const errorMessage = `
    <li class="d-flex message">
      <div class="message-body">
        <div class="message-row d-flex align-items-center">
          <div class="message-content p-3">
            服务器出现了一些故障，请稍后再试。
          </div>
        </div>
      </div>
    </li>
  `;
            $('#message-list').append(errorMessage);
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function addUserMessage(content) {
            // 转义用户输入的文本
            const safeContent = escapeHtml(content);

            // 构造消息的 HTML 结构，并将转义后的文本插入
            const newMessage = $(`
                <li class="d-flex message right">
                    <div class="message-body">
                        <div class="message-row d-flex align-items-center justify-content-end">
                            <div class="message-content border p-3">
                                <p>${safeContent}</p>
                            </div>
                            <div class="mr-lg-3 me-2" style="margin-left: 16px;">
                                <div class="avatar sm rounded-circle bg-primary d-flex align-items-center justify-content-center">
                                    <span>
                                        <img src="assets/images/user.png" class="avatar sm rounded-circle" alt="user avatar">
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </li>
            `);

            // 将生成的消息 HTML 添加到消息列表中
            $('#message-list').append(newMessage);
        }

        function showWaitingAnimation() {
            const waiting = `
    <li class="d-flex message" id="waiting">
      <div class="message-body">
        <div class="message-row d-flex align-items-center">
          <div class="message-content p-3">
            <p></p>
            <div class="wave" id="wave">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
        </div>
      </div>
    </li>
  `;
            $('#message-list').append(waiting);
        }

        function escapeSpecialCharsExceptCodeBlocks(str) {
        // Regex to find code blocks and inline code
        const codeBlocksRegex = /(```[\s\S]*?```|`[^`]*`)/g;
        let result = '';
        let lastIndex = 0;

        let match;
        while ((match = codeBlocksRegex.exec(str)) !== null) {
          // Handle the text before the code block
          let nonCodePart = str.slice(lastIndex, match.index);
          result += nonCodePart.replace(/#/g, '\\#');

          // Append the entire code block as is
          result += match[0];
          lastIndex = codeBlocksRegex.lastIndex;
        }

        // Handle the text after the last code block
        result += str.slice(lastIndex).replace(/#/g, '\\#');
        return result;
      }

      // Customize renderer
      const renderer = new marked.Renderer();
      renderer.text = (text) => {
        return text;  // We won't need to escape # here because we've handled it outside of marked
      };

      marked.use({ renderer });

      function addMessageChunk(chunk) {
            const waiting = $('#waiting');
            const currentContent = waiting.find('.message-content p').data('full-content') || '';

            // Combine new chunk with current content
            const newContent = currentContent + chunk;

            // Save the full content
            waiting.find('.message-content p').data('full-content', newContent);

            // Escape special characters in non-code regions
            const escapedContent = escapeSpecialCharsExceptCodeBlocks(newContent);
            // Parse Markdown and update HTML
            const parsedContent = marked.parse(escapedContent);
            // Update HTML content
            waiting.find('.message-content p').html(parsedContent);
            // 高亮新内容代码块
            waiting.find('pre code').each((i, block) => {
                hljs.highlightElement(block);
            });
        }

        function addCopyButton(codeBlock) {
            const button = $('<button class="copy-button">复制</button>');
            $(codeBlock).before(button);

            // 复制代码块内容到剪贴板
            button.on('click', () => {
                const code = $(codeBlock).text();
                copyToClipboard(code);
            });
        }

        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('代码已复制到剪贴板!');
        }


    </script>

    <!-- selectJS -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var chatItems = document.querySelectorAll('.chat-list li');
      var chatLinks = document.querySelectorAll('.chat-list a');

      // 从 localStorage 中读取上次选中的项
      var selectedIndex = parseInt(localStorage.getItem('selectedChatIndex'), 10);

      if (!isNaN(selectedIndex) && selectedIndex < chatItems.length && selectedIndex >= 0) {
        // 将读取的索引对应的项设置为选中状态
        chatItems[selectedIndex].classList.add('selected');
      } else {
        // 如果没有记录则默认选中第一个列表项
        if (chatItems.length > 0) {
          chatItems[0].classList.add('selected');
        }
      }

      // 事件委托：为聊天列表添加点击事件监听器
      document.querySelector('.chat-list').addEventListener('click', function (event) {
        var link = event.target.closest('a');

        if (link) {
          // 移除所有项的 'selected' 类
          chatItems.forEach(function (item) {
            item.classList.remove('selected');
          });

          // 为被点击的父项 <li> 添加 'selected' 类
          var parentItem = link.parentElement;
          if (parentItem) {
            parentItem.classList.add('selected');
          }

          // 获取当前项的索引并存储到 localStorage
          var index = Array.prototype.indexOf.call(chatItems, parentItem);
          if (index !== -1) {

            localStorage.setItem('selectedChatIndex', index);
          }
        }
      });
    });

  </script>
