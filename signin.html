<!DOCTYPE html>
<html lang="en">
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no"
  />
  <meta
    name="description"
    content="Responsive Bootstrap 4 and web Application ui kit."
  />
  <title>智启</title>
  <link rel="icon" href="https://www.lovechat.ink/icon/apple-touch-icon.png" type="image/x-icon" />

  <link
    rel="stylesheet"
    href="assets/fonts/material-icon/css/material-design-iconic-font.min.css"
  />

  <link rel="stylesheet" href="assets/css/style.min.css" />
  <body>
    <div id="layout" class="theme-cyan">
      <div class="authentication">
        <div class="container d-flex flex-column">
          <div
            class="row align-items-center justify-content-center no-gutters min-vh-100"
          >
            <div class="col-12 col-md-7 col-lg-5 col-xl-4 py-md-11">
              <div class="card border-0 shadow-sm">
                <div class="card-body">
                  <h3 class="text-center">登 录</h3>

                  <p class="text-center mb-6">
                    智启：河北师大软件学院自研AI入学助手
                  </p>

                  <form class="mb-4 mt-5" onkeypress="return submitOnEnter(event)">
                    <div class="input-group mb-2">
                      <input
                        type="text"
                        class="form-control form-control-lg"
                        placeholder="在此输入账号..."
                        id="username"
                      />
                    </div>

                    <div class="input-group mb-4">
                      <input
                        type="password"
                        class="form-control form-control-lg"
                        placeholder="在此输入密码..."
                        id="password"
                      />
                    </div>
                    
                    <div class="text-center mt-5">
                      <a
                        class="btn btn-lg btn-primary"
                        title=""
                        onclick="login()"
                        >点击登录</a>
                    </div>
                  
                  </form>
                </div>
              </div>
            </div>
            <div class="signin-img d-none d-lg-block text-center">
              <img
                src="assets/images/signin-img-cyan.svg"
                alt="Sign In Image"
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/vendor/jquery/jquery-3.5.1.min.js"></script>
    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
      function submitOnEnter(event) {
        if (event.key === "Enter") {
          event.preventDefault();  // 防止表单默认提交
          login();
        }
      }

      function login() {
        var username = $("#username").val();
        var password = $("#password").val();

        // 检查是否获取了输入值
        if (!username || !password) {
          alert("请填写用户名和密码！");
          return;
        }

        $.ajax({
          type: "POST",
          url: "/url/java/login",
          contentType: "application/json",
          data: JSON.stringify({
            username: username,
            password: password,
          }),
          success: function (result) {
            if (result.code === 200 && result.data != null) {
              // 密码正确
              // 存储token
              localStorage.setItem("user_token", result.data);
              location.href = "bot-chat.html";
            } else {
              alert(result.message);
            }
          },
        });
      }
    </script>
  </body>
</html>
